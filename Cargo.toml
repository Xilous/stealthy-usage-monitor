[package]
name = "stealthy-usage-monitor"
version = "2.4.0"
edition = "2021"
license = "MIT"
description = "Stealthy Usage Monitor"
homepage = "https://github.com/Xilous/stealthy-usage-monitor"
# The updater derives its GitHub owner/repo from this field at compile time
# (see github_repo() in src/updater.rs, which parses CARGO_PKG_REPOSITORY).
# Left on upstream, the fork would check CodeZeno's releases, download their
# binary and overwrite itself on the next update check.
repository = "https://github.com/Xilous/stealthy-usage-monitor"

[package.metadata.winres]
CompanyName = "Xilous"
ProductName = "Stealthy Usage Monitor"
FileDescription = "Stealthy Usage Monitor"
OriginalFilename = "stealthy-usage-monitor.exe"
InternalName = "StealthyUsageMonitor"
Comments = "https://github.com/Xilous/stealthy-usage-monitor"
# Retained: the code is Code Zeno's, used under MIT.
LegalCopyright = "Copyright (C) 2026 Code Zeno Pty Ltd"

[dependencies]
ureq = { version = "2", default-features = false, features = ["native-tls", "json", "proxy-from-env"] }
native-tls = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
]

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
